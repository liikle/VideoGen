[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
version = "0.1.0"
description = "Free, local, unlimited AI video generation (text-to-video and image-to-video) with LTX-2.5 and Wan 2.2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "diffusers>=0.41.0",
  "transformers>=5.19,<6",
  "accelerate>=1.10",
  "huggingface_hub>=1.32,<2",
  "safetensors>=0.8",
  "sentencepiece",
  "ftfy",
  "bitsandbytes>=0.48; sys_platform != 'darwin'",
  "spandrel>=0.4",
  "imageio-ffmpeg>=0.5",
  "numpy",
  "pillow",
  "psutil",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "playwright"]

[project.scripts]
videogen = "videogen.cli:main"

[tool.setuptools.packages.find]
include = ["videogen*"]

[tool.setuptools.package-data]
videogen = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "browser: drives the web UI in Chromium via Playwright",
  "pipelines: runs the real diffusers pipelines with tiny random weights (slow, needs torch)",
]

[tool.ruff]
line-length = 120
